# Builds Dune Runner for Android and iOS on every push, publishes the files
# as a GitHub Release, and (optionally) deploys the web build to Cloudflare.
#
#   push to main  ->  "latest" pre-release, replaced each time
#   push a tag v* ->  a permanent release named after the tag
#
# Optional repository secrets (Settings ▸ Secrets and variables ▸ Actions):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
#   ANDROID_KEY_PASSWORD     -> signed release APK + AAB for Google Play
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID -> deploy the website
# Optional repository variable:
#   CF_PAGES_PROJECT         -> Cloudflare Pages project name (default: fjmk)
# Without them everything still builds; the release APK is just unsigned and
# the website step is skipped.

name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Release signing (only if the keystore secrets exist)
        if: env.KS_B64 != ''
        run: |
          echo "$KS_B64" | base64 --decode > release.jks
          {
            echo "storeFile=$PWD/release.jks"
            echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}"
          } > keystore.properties
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease bundleRelease
      - name: Collect
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk out/DuneRunner-debug.apk
          if [ -n "$KS_B64" ]; then
            cp app/build/outputs/apk/release/*.apk out/DuneRunner-release.apk
            cp app/build/outputs/bundle/release/*.aab out/DuneRunner-release.aab
          else
            cp app/build/outputs/apk/release/*.apk out/DuneRunner-release-unsigned.apk
          fi
          rm -f release.jks keystore.properties
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (unsigned)
        run: |
          xcodebuild -project ios/DuneRunner.xcodeproj -target DuneRunner \
            -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
      - name: Package .ipa
        run: |
          mkdir -p Payload out
          cp -R build/Release-iphoneos/DuneRunner.app Payload/
          test -f Payload/DuneRunner.app/game/index.html   # the game really is inside
          zip -qry out/DuneRunner-unsigned.ipa Payload
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: out/*

  web:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Cloudflare Pages
        if: env.CF_TOKEN != '' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 pages deploy app/src/main/assets/game --project-name="${{ vars.CF_PAGES_PROJECT || 'fjmk' }}" --branch=main
      - name: Package the web build
        run: cd app/src/main/assets/game && zip -qr "$GITHUB_WORKSPACE/DuneRunner-web.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: DuneRunner-web.zip

  release:
    needs: [android, ios, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          ls -la dist
          NOTES="Built from ${GITHUB_SHA::7}.

          - DuneRunner-debug.apk: install directly on any Android phone (allow installs from unknown sources).
          - DuneRunner-release*.apk / .aab: release build (signed when the keystore secrets are set; .aab is what Google Play takes).
          - DuneRunner-unsigned.ipa: iPhone/iPad build. Apple requires signing before it will install: use Xcode, Sideloadly or AltStore with your Apple ID, or TestFlight with a developer account.
          - DuneRunner-web.zip: the website build for Cloudflare Pages."
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$REPO" --title "Dune Runner $GITHUB_REF_NAME" --notes "$NOTES"
          else
            gh release delete latest --repo "$REPO" --cleanup-tag --yes || true
            gh release create latest dist/* --repo "$REPO" --target "$GITHUB_SHA" --prerelease \
              --title "Latest build (main)" --notes "$NOTES"
          fi
