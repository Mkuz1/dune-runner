# Builds Dune Runner for Android and iOS on every push, publishes the files
# as a GitHub Release, and (optionally) deploys the web build to Cloudflare.
#
#   push to main  ->  "latest" pre-release, replaced each time
#   push a tag v* ->  a permanent release named after the tag
#
# Optional repository secrets (Settings ▸ Secrets and variables ▸ Actions):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
#   ANDROID_KEY_PASSWORD     -> signed release APK + AAB for Google Play
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID -> deploy the website
#   RELEASES_DEPLOY_KEY      -> SSH key with write access to the public repo
#                               <owner>/dune-runner-releases; pushes
#                               to main publish the signed APK + IPA there with
#                               the version.json the in-app updater reads
# Optional repository variable:
#   CF_PAGES_PROJECT         -> Cloudflare Pages project name (default: fjmk)
#   RELEASES_REPO            -> where updates are published (default:
#                               <owner>/dune-runner-releases). The apps and the
#                               website read version.json from Mkuz1/dune-runner-releases
#                               (Updater.java, Updater.swift, src/updates.js).
#
# Versions: versionCode / CFBundleVersion = run number + 10, versionName =
# 1.2.<run number>, so every build is newer than the one before it.
# Without them everything still builds; the release APK is just unsigned and
# the website step is skipped.

name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp the version into the game
        run: |
          printf '{ "versionName": "1.2.%s", "versionCode": %s }\n' "$GITHUB_RUN_NUMBER" "$((GITHUB_RUN_NUMBER + 10))" \
            > app/src/main/assets/game/build.json
          cat app/src/main/assets/game/build.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'   # the default also asks for 'tools', which no longer exists
      - name: Release signing (only if the keystore secrets exist)
        if: env.KS_B64 != ''
        run: |
          echo "$KS_B64" | base64 --decode > release.jks
          {
            echo "storeFile=$PWD/release.jks"
            echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}"
          } > keystore.properties
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon \
            -PversionCode=$((GITHUB_RUN_NUMBER + 10)) -PversionName="1.2.$GITHUB_RUN_NUMBER" \
            assembleDebug assembleRelease bundleRelease
      - name: Collect
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk out/DuneRunner-debug.apk
          if [ -n "$KS_B64" ]; then
            cp app/build/outputs/apk/release/*.apk out/DuneRunner-release.apk
            cp app/build/outputs/bundle/release/*.aab out/DuneRunner-release.aab
          else
            cp app/build/outputs/apk/release/*.apk out/DuneRunner-release-unsigned.apk
          fi
          rm -f release.jks keystore.properties
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stamp the version into the game
        run: |
          printf '{ "versionName": "1.2.%s", "versionCode": %s }\n' "$GITHUB_RUN_NUMBER" "$((GITHUB_RUN_NUMBER + 10))" \
            > app/src/main/assets/game/build.json
          cat app/src/main/assets/game/build.json
      - name: Build (unsigned)
        run: |
          xcodebuild -project ios/DuneRunner.xcodeproj -target DuneRunner \
            -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=$((GITHUB_RUN_NUMBER + 10)) MARKETING_VERSION="1.2.$GITHUB_RUN_NUMBER" \
            build
      - name: Package .ipa
        run: |
          mkdir -p Payload out
          cp -R build/Release-iphoneos/DuneRunner.app Payload/
          test -f Payload/DuneRunner.app/game/index.html   # the game really is inside
          zip -qry out/DuneRunner-unsigned.ipa Payload
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: out/*

  web:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp the version into the game
        run: |
          printf '{ "versionName": "1.2.%s", "versionCode": %s }\n' "$GITHUB_RUN_NUMBER" "$((GITHUB_RUN_NUMBER + 10))" \
            > app/src/main/assets/game/build.json
          cat app/src/main/assets/game/build.json
      - name: Deploy to Cloudflare Pages
        if: env.CF_TOKEN != '' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 pages deploy app/src/main/assets/game --project-name="${{ vars.CF_PAGES_PROJECT || 'fjmk' }}" --branch=main
      - name: Package the web build
        run: cd app/src/main/assets/game && zip -qr "$GITHUB_WORKSPACE/DuneRunner-web.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: DuneRunner-web.zip

  # The in-app updater's source: a public repo holding only the latest build.
  # Each run replaces its single commit, so the repo never grows.
  publish-updates:
    needs: [android, ios, web]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      DEPLOY_KEY: ${{ secrets.RELEASES_DEPLOY_KEY }}
      RELEASES_REPO: ${{ vars.RELEASES_REPO || format('{0}/dune-runner-releases', github.repository_owner) }}
      NOTES: ${{ github.event.head_commit.message }}
    steps:
      - uses: actions/download-artifact@v4
        if: env.DEPLOY_KEY != ''
        with:
          path: dist
          merge-multiple: true
      - name: Publish to dune-runner-releases
        if: env.DEPLOY_KEY != ''
        run: |
          if [ ! -f dist/DuneRunner-release.apk ]; then
            echo "::warning::No signed release APK (keystore secrets missing) — not publishing an update."
            exit 0
          fi
          mkdir site
          cp dist/DuneRunner-release.apk site/DuneRunner.apk
          cp dist/DuneRunner-unsigned.ipa site/DuneRunner.ipa
          python3 - <<'PY'
          import json, os, datetime
          run = int(os.environ['GITHUB_RUN_NUMBER'])
          base = f"https://raw.githubusercontent.com/{os.environ['RELEASES_REPO']}/main/"
          notes = (os.environ.get('NOTES') or '').strip().splitlines()
          v = {
            'versionCode': run + 10,
            'versionName': f'1.2.{run}',
            'sha': os.environ['GITHUB_SHA'][:7],
            'date': datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
            'notes': notes[0][:200] if notes else '',
            'apk': base + 'DuneRunner.apk', 'apkSize': os.path.getsize('site/DuneRunner.apk'),
            'ipa': base + 'DuneRunner.ipa', 'ipaSize': os.path.getsize('site/DuneRunner.ipa'),
          }
          json.dump(v, open('site/version.json', 'w'), indent=2)
          open('site/README.md', 'w').write(f"""# Dune Runner — latest build

          **Version {v['versionName']}** (build {v['versionCode']}, {v['date'][:10]})

          - [DuneRunner.apk]({v['apk']}) — Android. Installed copies update themselves from inside the app.
          - [DuneRunner.ipa]({v['ipa']}) — iPhone / iPad, unsigned: install with AltStore, SideStore or Sideloadly.

          `version.json` is what the apps read to find out an update exists.
          """)
          PY
          cat site/version.json
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts
          cd site
          git init -q -b main
          git -c user.name="dune-runner CI" -c user.email="ci@users.noreply.github.com" add -A
          git -c user.name="dune-runner CI" -c user.email="ci@users.noreply.github.com" commit -q -m "Build 1.2.$GITHUB_RUN_NUMBER (${GITHUB_SHA::7})"
          git push -f "git@github.com:$RELEASES_REPO.git" main

  release:
    needs: [android, ios, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          ls -la dist
          NOTES="Built from ${GITHUB_SHA::7}.

          - DuneRunner-debug.apk: install directly on any Android phone (allow installs from unknown sources).
          - DuneRunner-release*.apk / .aab: release build (signed when the keystore secrets are set; .aab is what Google Play takes).
          - DuneRunner-unsigned.ipa: iPhone/iPad build. Apple requires signing before it will install: use Xcode, Sideloadly or AltStore with your Apple ID, or TestFlight with a developer account.
          - DuneRunner-web.zip: the website build for Cloudflare Pages."
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$REPO" --title "Dune Runner $GITHUB_REF_NAME" --notes "$NOTES"
          else
            gh release delete latest --repo "$REPO" --cleanup-tag --yes || true
            gh release create latest dist/* --repo "$REPO" --target "$GITHUB_SHA" --prerelease \
              --title "Latest build (main)" --notes "$NOTES"
          fi
